[project]
name = "smflw-api"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "anthropic>=1,<2",
  "boto3>=1.40,<2",
  "fastapi>=0.115,<1",
  "mangum>=0.19,<1",
  "pillow>=11,<13",
  "pydantic-settings>=2.9,<3",
  "reportlab>=4,<5",
  "supabase>=2.15,<3",
  "uvicorn>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smflw_api"]
