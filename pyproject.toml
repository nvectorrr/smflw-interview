[project]
name = "smflw-interview"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = []

[tool.uv.workspace]
members = ["backend"]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
    "moto[s3,server]>=5,<6",
    "httpx2>=2.16,<3",
]

[tool.ruff]
target-version = "py313"
extend-exclude = ["**/sst.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
